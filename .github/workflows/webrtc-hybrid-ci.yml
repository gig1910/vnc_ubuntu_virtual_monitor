name: WebRTC hybrid CI

on:
  push:
    branches:
      - feature/webrtc-hybrid
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            dpkg-dev \
            util-linux \
            libvncserver-dev \
            libssl-dev \
            nettle-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libpipewire-0.3-dev \
            libjpeg-dev \
            libpam0g-dev \
            ca-certificates

      - name: Clean compile
        run: |
          make clean
          make -j"$(nproc)" all auth-helper

      - name: Broker protocol regression
        run: |
          mkdir -p build
          cc -Iinclude -O2 -Wall -Wextra \
            tests/broker_protocol_test.c src/broker_protocol.c \
            -o build/broker_protocol_test
          ./build/broker_protocol_test

      - name: TLS certificate/private-key regression
        run: |
          mkdir -p build/tls-test
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -subj '/CN=pair-one' \
            -keyout build/tls-test/key-one.pem \
            -out build/tls-test/cert-one.pem >/dev/null 2>&1
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -subj '/CN=pair-two' \
            -keyout build/tls-test/key-two.pem \
            -out build/tls-test/cert-two.pem >/dev/null 2>&1
          cc -Iinclude -O2 -Wall -Wextra \
            tests/tls_pair_test.c src/tls_pair.c \
            $(pkg-config --cflags --libs openssl) \
            -o build/tls_pair_test
          ./build/tls_pair_test \
            build/tls-test/cert-one.pem \
            build/tls-test/key-one.pem ok
          ./build/tls_pair_test \
            build/tls-test/cert-one.pem \
            build/tls-test/key-two.pem fail

      - name: Legacy Safari web frontend regression
        run: |
          bash tests/web_legacy_safari_test.sh

      - name: Build and verify Debian package
        run: |
          # build-deb.sh intentionally refuses root. GitHub container jobs run
          # as root, so execute the package builder as an unprivileged account
          # instead of weakening the script's normal safety check.
          chown -R nobody:nogroup "$GITHUB_WORKSPACE"
          runuser -u nobody -- \
            ./build-deb.sh --clean --jobs "$(nproc)"
