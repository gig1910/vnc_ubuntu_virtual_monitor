# VNC Monitor 0.1.0 beta configuration
#
# Precedence:
#   built-in defaults < this file < command-line options
#
# The installer copies this file to:
#   ~/.config/vnc-monitor/config.ini
# only when that file does not already exist.

[capture]
# Native PipeWire is the production backend. GStreamer remains a fallback.
backend=pipewire
timeout-ms=5000
cursor=metadata
fps=60

[display]
# auto  = width/height are the initial/fallback size; clients advertising
#         ExtendedDesktopSize may request a different framebuffer size.
# fixed = always use width x height and reject client resize requests.
mode=auto
width=1024
height=768
layout-remember=on
layout-resave=off

[transport]
# source means publish as fast as newly captured states arrive.
vnc-fps=source
latest-only=on
diff-detect=on
diff-tile-size=32

[network]
port=5901
backend-port=5903
backend-bind=127.0.0.1
external-send-buffer=65536
backend-recv-buffer=65536

# The server is intentionally STRONG SINGLE CONNECT: while one viewer owns
# the virtual monitor, additional TCP clients are accepted only to be rejected
# immediately. These values control dead-peer detection for the active client.
# They do NOT disconnect a healthy client merely because the image is static.
client-keepalive-idle=15
client-keepalive-interval=5
client-keepalive-probes=3
client-user-timeout-ms=20000

# During the unauthenticated RA2/PAM negotiation, socket reads/writes may not
# block forever. The timeout is removed after successful authentication.
client-handshake-timeout-ms=60000

[ra2]
record-size=16384
coalesce=on
coalesce-us=500
key=$HOME/.config/vnc-monitor/ra2-server-key.pem
auth-socket=/run/vnc-monitor-auth.sock

[logging]
level=info
