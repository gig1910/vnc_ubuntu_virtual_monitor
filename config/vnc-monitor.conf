# VNC Monitor 0.1.0 beta configuration
#
# Runtime precedence for the user agent:
#   built-in defaults
#     < /etc/vnc-monitor/config.ini
#     < ~/.config/vnc-monitor/config.ini (or explicit --config FILE)
#     < command-line options
#
# Packaging installs this template as the system baseline:
#   /etc/vnc-monitor/config.ini
#
# Source install also creates a per-user copy on first install:
#   ~/.config/vnc-monitor/config.ini
# That user file is preserved on upgrades and overrides agent settings from
# the system baseline.
#
# IMPORTANT for broker mode:
#   [network] port is owned by the system broker and is read ONLY from
#   /etc/vnc-monitor/config.ini. A per-user override of port does not move the
#   machine-wide public listener. The other network keys below are consumed by
#   the user agent for the handed-off client/backend sockets.

[capture]
# Native PipeWire is the production backend. GStreamer remains a fallback.
backend=pipewire
timeout-ms=5000
cursor=metadata
fps=60

[display]
# auto  = width/height are the initial/fallback size; clients advertising
#         ExtendedDesktopSize may request a different framebuffer size.
# fixed = always use width x height and reject client resize requests.
mode=auto
width=1024
height=768
layout-remember=on
layout-resave=off

[transport]
# source means publish as fast as newly captured states arrive.
vnc-fps=source
latest-only=on
diff-detect=on
diff-tile-size=32

[network]
# Machine-wide broker listener. Effective only from /etc/vnc-monitor/config.ini
# in production broker mode. Standalone developer mode still uses its effective
# layered value directly.
port=5901

backend-port=5903
backend-bind=127.0.0.1
external-send-buffer=65536
backend-recv-buffer=65536

# The broker/agent stack is intentionally STRONG SINGLE CONNECT: while one
# viewer owns one authenticated logind session, additional TCP clients are
# rejected immediately. These values control dead-peer detection for the
# handed-off active client. They do NOT disconnect a healthy client merely
# because the image is static.
client-keepalive-idle=15
client-keepalive-interval=5
client-keepalive-probes=3
client-user-timeout-ms=20000

# One monotonic deadline covers the unauthenticated RA2/auth-helper io_* phase.
# It prevents a silent or trickle-slow client from owning the only slot forever.
# The deadline is completely removed after successful authentication.
client-handshake-timeout-ms=60000

[ra2]
record-size=16384
coalesce=on
coalesce-us=500
key=$HOME/.config/vnc-monitor/ra2-server-key.pem
auth-socket=/run/vnc-monitor-auth.sock

[logging]
level=info
