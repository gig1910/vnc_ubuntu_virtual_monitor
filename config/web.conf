# VNC Monitor browser/WebRTC broker configuration
#
# This file is machine-owned and consumed only by vnc-monitor-broker.
# Per-user configuration cannot enable/move the HTTPS listener or replace its
# TLS identity.
#
# Installed path:
#   /etc/vnc-monitor/web.ini

[web]
# Keep disabled until a certificate/private key have been installed and the
# browser transport is ready for testing.
enabled=false

# Development/LAN/VPN HTTPS listener. The current broker sandbox permits IPv4
# and the embedded server deliberately listens on IPv4 only.
port=8443

# PEM certificate chain and matching PEM private key.
certificate=/etc/vnc-monitor/tls/server.crt
private-key=/etc/vnc-monitor/tls/server.key
